<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFrigo – Login</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">

    <div class="auth-logo">
      <div class="icon">❄️</div>
      <h1>Smart<span>Frigo</span></h1>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showTab('login')">Login</button>
      <button class="auth-tab" onclick="showTab('register')">Register</button>
    </div>

    <p class="error-msg" id="error-msg"></p>

    <!-- Login form -->
    <form class="auth-form active" id="form-login" onsubmit="doLogin(event)">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">Sign In →</button>
    </form>

    <!-- Register form -->
    <form class="auth-form" id="form-register" onsubmit="doRegister(event)">
      <div class="field">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="Alex Martin" required>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" placeholder="Min. 8 characters" minlength="8" required>
      </div>
      <button type="submit" class="btn-primary">Create Account →</button>
    </form>

  </div>
</div>

<div id="toast-container"></div>
<script src="../js/shared.js"></script>
<script>
  if (getUser()) {
    window.location.href = "dashboard.html";
  }

  function showTab(tab) {
    var tabs = document.querySelectorAll(".auth-tab");
    for (var i = 0; i < tabs.length; i++) {
      var btn = tabs[i];
      if ((i === 0 && tab === "login") || (i === 1 && tab === "register")) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    }
    document.getElementById("form-login").classList.toggle("active", tab === "login");
    document.getElementById("form-register").classList.toggle("active", tab === "register");
    document.getElementById("error-msg").textContent = "";
  }

  function showError(msg) {
    var el = document.getElementById("error-msg");
    el.textContent = "⚠ " + msg;
    el.classList.add("show");
  }

  async function doLogin(e) {
    e.preventDefault();
    var email = document.getElementById("login-email").value;
    var password = document.getElementById("login-password").value;

    var res = await api("auth.php", "login", { email: email, password: password });
    if (res.success) {
      setUser(res.user);
      window.location.href = "dashboard.html";
    } else {
      showError(res.message);
    }
  }

  async function doRegister(e) {
    e.preventDefault();
    var name = document.getElementById("reg-name").value;
    var email = document.getElementById("reg-email").value;
    var password = document.getElementById("reg-password").value;

    var res = await api("auth.php", "register", { name: name, email: email, password: password });
    if (res.success) {
      setUser(res.user);
      window.location.href = "dashboard.html";
    } else {
      showError(res.message);
    }
  }
</script>
</body>
</html>
