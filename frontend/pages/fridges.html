<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartFrigo – My Fridges</title>
  <link rel="stylesheet" href="../css/shared.css">
  <link rel="stylesheet" href="../css/fridges.css">
</head>
<body>

<div id="app"></div>
<div id="toast-container"></div>

<!-- Add/Edit Fridge Modal -->
<div class="modal-overlay" id="modal-fridge">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Add Fridge</span>
      <button class="modal-close" onclick="closeModal('modal-fridge')">✕</button>
    </div>
    <form onsubmit="saveFridge(event)">
      <input type="hidden" id="fridge-original-serial">
      <div class="form-group">
        <label for="fridge-name">Fridge Name</label>
        <input type="text" id="fridge-name" placeholder="e.g. Kitchen Fridge" required>
      </div>
      <div class="form-group">
        <label for="fridge-serial">Serial Number</label>
        <input type="text" id="fridge-serial" placeholder="e.g. SF-2024-XXXX" required>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label for="fridge-min">Min Temp (°C)</label>
          <input type="number" id="fridge-min" value="1" step="0.5" required>
        </div>
        <div class="form-group">
          <label for="fridge-max">Max Temp (°C)</label>
          <input type="number" id="fridge-max" value="8" step="0.5" required>
        </div>
      </div>
      <div class="form-group">
        <label for="fridge-location">Location</label>
        <input type="text" id="fridge-location" placeholder="e.g. Kitchen">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modal-fridge')">Cancel</button>
        <button type="submit" class="btn btn-cyan">Save Fridge</button>
      </div>
    </form>
  </div>
</div>

<!-- Temp Settings Modal -->
<div class="modal-overlay" id="modal-temp">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="temp-modal-title">Temperature Settings</span>
      <button class="modal-close" onclick="closeModal('modal-temp')">✕</button>
    </div>
    <div id="temp-current"></div>
    <form onsubmit="saveTemp(event)">
      <input type="hidden" id="temp-fridge-serial">
      <div class="grid-2">
        <div class="form-group">
          <label for="temp-min">Min Temp (°C)</label>
          <input type="number" id="temp-min" step="0.5" required>
        </div>
        <div class="form-group">
          <label for="temp-max">Max Temp (°C)</label>
          <input type="number" id="temp-max" step="0.5" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal('modal-temp')">Cancel</button>
        <button type="submit" class="btn btn-cyan">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/shared.js"></script>
<script>
  requireAuth();

  var fridges = [];

  async function init() {
    var res = await api("fridges.php", "getAll");
    fridges = res.fridges || [];
    renderPage();
  }

  function renderPage() {
    var html = renderSidebar("fridges") +
    '<main class="main fade-in">' +
      '<div class="page-header">' +
        '<div class="page-breadcrumb">SmartFrigo / <span>My Fridges</span></div>' +
        '<h1>My Fridges</h1>' +
        '<p>Manage your connected refrigerators.</p>' +
      '</div>' +
      '<div class="section-header mb-20">' +
        '<span></span>' +
        '<button class="btn btn-cyan" onclick="openAdd()">＋ Add Fridge</button>' +
      '</div>' +
      '<div class="fridges-grid" id="fridges-grid"></div>' +
    '</main>';
    document.getElementById("app").innerHTML = html;
    renderFridges();
  }

  function renderFridges() {
    var grid = document.getElementById("fridges-grid");
    var html = "";
    for (var i = 0; i < fridges.length; i++) {
      var f = fridges[i];
      var cur = parseFloat(f.current_temp);
      var min = parseFloat(f.min_temp);
      var max = parseFloat(f.max_temp);
      var ok = cur >= min && cur <= max;
      var pct = Math.min(100, Math.max(0, ((cur - min) / (max - min)) * 100));
      var status = "OFFLINE";
      var badge = "info";
      if (f.status === "online") {
        if (ok) {
          status = "NORMAL";
          badge = "ok";
        } else {
          status = "ALERT";
          badge = "danger";
        }
      }
      html += '<div class="fridge-card">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between">' +
          '<div class="fridge-icon">🧊</div>' +
          '<div class="badge badge-' + badge + '">' + status + '</div>' +
        '</div>' +
        '<div class="fridge-name">' + f.name + '</div>' +
        '<div class="fridge-serial">' + f.serial + ' · ' + f.location + '</div>' +
        '<div class="fridge-temp ' + (cur > max ? 'warm' : 'cold') + '">' + cur + '°C</div>' +
        '<div style="font-size:11px;color:var(--muted);margin-top:2px">Range: ' + min + '°C – ' + max + '°C</div>' +
        '<div class="progress-bar mt-8">' +
          '<div class="progress-fill" style="width:' + pct + '%;background:' + (ok ? 'var(--ok)' : 'var(--danger)') + '"></div>' +
        '</div>' +
        '<div class="fridge-actions">' +
          '<button class="btn btn-sm btn-ghost" onclick="openTemp(\'' + f.serial + '\')">🌡 Temp</button>' +
          '<button class="btn btn-sm btn-ghost" onclick="openEdit(\'' + f.serial + '\')">✏️ Edit</button>' +
          '<button class="btn btn-sm btn-danger" onclick="deleteFridge(\'' + f.serial + '\')">🗑</button>' +
        '</div>' +
      '</div>';
    }
    html += '<div class="fridge-card add-card" onclick="openAdd()">' +
      '<div class="add-icon">＋</div>' +
      '<div class="add-label">Add New Fridge</div>' +
    '</div>';
    grid.innerHTML = html;
  }

  function openAdd() {
    document.getElementById("modal-title").textContent = "Add Fridge";
    document.getElementById("fridge-original-serial").value = "";
    document.getElementById("fridge-name").value = "";
    document.getElementById("fridge-serial").value = "SF-2024-" + Math.random().toString(36).slice(2,6).toUpperCase();
    document.getElementById("fridge-min").value = 1;
    document.getElementById("fridge-max").value = 8;
    document.getElementById("fridge-location").value = "";
    document.getElementById("fridge-serial").removeAttribute("readonly");
    openModal("modal-fridge");
  }

  function openEdit(serial) {
    var found = null;
    for (var i = 0; i < fridges.length; i++) {
      if (fridges[i].serial === serial) {
        found = fridges[i];
        break;
      }
    }
    if (!found) {
      return;
    }
    document.getElementById("modal-title").textContent = "Edit Fridge";
    document.getElementById("fridge-original-serial").value = found.serial;
    document.getElementById("fridge-name").value = found.name;
    document.getElementById("fridge-serial").value = found.serial;
    document.getElementById("fridge-serial").setAttribute("readonly", true);
    document.getElementById("fridge-min").value = found.min_temp;
    document.getElementById("fridge-max").value = found.max_temp;
    document.getElementById("fridge-location").value = found.location;
    openModal("modal-fridge");
  }

  async function saveFridge(e) {
    e.preventDefault();
    var originalSerial = document.getElementById("fridge-original-serial").value;
    var data = {
      name: document.getElementById("fridge-name").value,
      serial: document.getElementById("fridge-serial").value,
      min_temp: document.getElementById("fridge-min").value,
      max_temp: document.getElementById("fridge-max").value,
      location: document.getElementById("fridge-location").value
    };

    if (originalSerial) {
      await api("fridges.php", "edit", data);
      showToast("Fridge updated", "success");
    } else {
      var res = await api("fridges.php", "add", data);
      if (!res.success) {
        showToast(res.message, "error");
        return;
      }
      if (res.shared) {
        showToast("Shared fridge linked to your account!", "success");
      } else {
        showToast("Fridge added", "success");
      }
    }

    closeModal("modal-fridge");
    init();
  }

  async function deleteFridge(serial) {
    if (!confirm("Remove this fridge from your account?")) {
      return;
    }
    await api("fridges.php", "delete", { serial: serial });
    showToast("Fridge removed", "info");
    init();
  }

  function openTemp(serial) {
    var found = null;
    for (var i = 0; i < fridges.length; i++) {
      if (fridges[i].serial === serial) {
        found = fridges[i];
        break;
      }
    }
    if (!found) {
      return;
    }
    var cur = parseFloat(found.current_temp);
    var ok = cur >= parseFloat(found.min_temp) && cur <= parseFloat(found.max_temp);

    document.getElementById("temp-modal-title").textContent = "🌡 " + found.name;
    document.getElementById("temp-fridge-serial").value = found.serial;
    document.getElementById("temp-min").value = found.min_temp;
    document.getElementById("temp-max").value = found.max_temp;
    document.getElementById("temp-current").innerHTML =
      '<div class="temp-big">' +
        '<div class="value" style="color:' + (ok ? 'var(--cyan)' : 'var(--danger)') + '">' + cur + '°C</div>' +
        '<div class="badge badge-' + (ok ? 'ok' : 'danger') + '" style="margin:12px auto;display:inline-flex">' +
          (ok ? 'Normal' : '⚠ Out of Range') +
        '</div>' +
      '</div><hr>';
    openModal("modal-temp");
  }

  async function saveTemp(e) {
    e.preventDefault();
    var serial = document.getElementById("temp-fridge-serial").value;
    var min = document.getElementById("temp-min").value;
    var max = document.getElementById("temp-max").value;
    await api("fridges.php", "updateRange", { serial: serial, min_temp: min, max_temp: max });
    closeModal("modal-temp");
    showToast("Temperature settings saved", "success");
    init();
  }

  var modalOverlays = document.querySelectorAll(".modal-overlay");
  for (var i = 0; i < modalOverlays.length; i++) {
    modalOverlays[i].addEventListener("click", function (e) {
      if (e.target === this) {
        this.classList.remove("show");
      }
    });
  }

  init();
</script>
</body>
</html>
